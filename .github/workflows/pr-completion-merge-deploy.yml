name: PR Completion Merge Deploy Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: read

jobs:
  completion-gate:
    name: PR Completion Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Luna Codex handoff contract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const marker = '## Luna / Codex Handoff';
            if (!body.includes(marker)) {
              core.setFailed(`Missing required PR contract marker: ${marker}`);
            }

      - name: Validate changed-file intent
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            if (files.length === 0) {
              core.setFailed('PR contains no changed files');
              return;
            }

            const nonCodePurpose = /\b(documentation|docs|research|transcript|archival|archive|data|specification|spec-only|non-code)\b/i;
            const implementation = files.some(file =>
              !file.filename.startsWith('docs/') &&
              !file.filename.includes('luna-pr') &&
              !/\.(md|mdx|txt|rst|csv|tsv|jsonl)$/i.test(file.filename)
            );

            if (!implementation && !nonCodePurpose.test(context.payload.pull_request.body || '')) {
              core.setFailed('Non-code PRs must explicitly identify their documentation, research, transcript, archival, data, or specification purpose in the Luna / Codex Handoff.');
            }

  deploy:
    name: Deployment Hook
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment placeholder
        run: echo "Deployment hook ready for repository-specific deployment target"
